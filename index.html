</style></head><body><header><div class="tag">Cabin crew · B2 interview preparation</div><h1>Flying Together</h1><p>7 units · aviation roles · grammar · cabin scenarios · interview practice · video comprehension</p></header><div class="wrap"><nav aria-label="Lessons"></nav><main id="content"></main></div><script>
const emLessons=[
{heading:'Present Perfect · Guest experience',passage:'During a recent flight to Dubai, a passenger approached the crew because her connecting flight had been changed. The crew member listened carefully, checked the information available to the team and explained that the passenger should speak to the relevant ground staff on arrival. She remained calm and reassured the guest without promising an outcome she could not guarantee.',focus:'Experience vs finished events',qs:[['I ___ with customers from many cultural backgrounds.','have worked','worked','had work','am worked'],['Last summer, I ___ a complaint about a delayed service.','handled','have handled','had handle','handling'],['She ___ already ___ the guest about the change.','has / informed','have / inform','did / informed','was / inform'],['We ___ the passenger yet.','haven’t contacted','didn’t contacted','hadn’t contact','don’t contacted'],['How long ___ you ___ in customer service?','have / worked','did / worked','are / work','had / working']]},
{heading:'Past Perfect · Passenger incident',passage:'By the time the cabin crew reached row 24, a passenger had become upset because another traveller had placed a large bag in the overhead compartment above his seat. Earlier, the passenger had asked for assistance, but the crew were helping another family. After the crew member had listened to both passengers, she explained the available options and helped them settle the disagreement. The situation was resolved before departure.',focus:'Sequence and narrative connectors',qs:[['By the time the crew arrived, the passenger ___ upset.','had become','has become','becomes','will become'],['After she ___ to both guests, she suggested a solution.','had listened','has listening','listen','was listen'],['The guest complained because someone ___ his space.','had used','has use','using','will use'],['___ boarding began, the team had completed the briefing.','Before','Afterwards','Since','During'],['The crew ___ the issue before departure.','resolved','had resolving','have resolve','were resolve']]},
{heading:'Passive Voice · Safety and service',passage:'Before departure, cabin equipment is checked by authorised crew members. Any irregularities must be reported through the appropriate channels. Passengers are reminded to fasten their seat belts when instructed. During service, special meals are distributed according to the information available to the crew. Operational decisions are made in line with the airline’s procedures.',focus:'Passive forms and obligation',qs:[['The safety briefing ___ before departure.','is delivered','delivers','has delivering','deliver'],['The passenger ___ about the delay yesterday.','was informed','is informing','has inform','inform'],['Special meals ___ according to the manifest.','are distributed','distributes','is distribute','distributed being'],['Any issue must ___ to the appropriate team.','be reported','reported','be reporting','reports'],['The announcement ___ shortly.','will be made','will made','will be make','is make']]},
{heading:'Reported Speech · Cabin communication',passage:'A passenger told a crew member that she felt unwell. The crew member said that she would contact the appropriate colleague and follow the required procedures. Another guest asked whether the flight was delayed. The crew member explained that the latest information would be shared as soon as it was available. Clear reporting helped the team coordinate its response.',focus:'Reporting statements and questions',qs:[['“I feel unwell.” She said she ___ unwell.','felt','feels','feeling','had feel'],['“Can you help me?” He asked whether I ___ help him.','could','can to','will can','have'],['“We will update you.” They said they ___ update us.','would','will to','had','have'],['“Where is my seat?” She asked where her seat ___.','was','is it','did be','were it'],['“Do not block the aisle.” The crew member told us ___ the aisle.','not to block','to not blocking','don’t blocking','not block']]},
{heading:'Conditionals · Problem solving',passage:'During boarding, a passenger notices that their assigned seat is occupied. If the crew member listens first, the passenger is more likely to remain calm. If the seat allocation is unclear, the crew member should verify the relevant information rather than guess. If a customer were particularly distressed, the crew member would use a reassuring tone and seek support when necessary. Safety and respectful communication remain priorities.',focus:'Real and hypothetical situations',qs:[['If a guest needs help, I ___ listen carefully.','will','would have','had','was'],['If I ___ in that situation, I would stay calm.','were','am','will be','had been'],['Unless we ___ the information, we should not promise a solution.','verify','verified','will verify','had verified'],['If the crew had received the update earlier, they ___ the passenger sooner.','could have informed','will inform','can informing','had inform'],['If a passenger ___ upset, I would acknowledge their concern.','became','becomes will','had become will','become']]},
{heading:'Final assessment · Professional judgment',passage:'A family boards a long-haul flight with a young child who is anxious about flying. One parent requests immediate assistance while other passengers are waiting in the aisle. A crew member acknowledges the concern, asks a colleague for support and explains what assistance can be provided. The team continues boarding without dismissing the family’s needs. After take-off, the crew checks on the family when operationally appropriate.',focus:'Integrated B2 accuracy',qs:[['The passenger asked ___ she could change seats.','whether','that','what','which'],['The crew ___ the issue before boarding ended.','had resolved','have resolve','was resolve','resolving'],['Passengers must ___ instructions from the crew.','follow','following','followed','to following'],['If I were responsible, I ___ ask for support.','would','will','have','had'],['The information ___ to the family clearly.','was explained','explained','has explain','explaining']]}
];
const emReadings=[
[['What was the passenger worried about?','A changed connecting flight','A missing suitcase','An incorrect meal','A broken seat'],['What did the crew member avoid?','Promising an unconfirmed outcome','Listening to the passenger','Checking information','Speaking calmly']],
[['Why was the passenger upset?','Someone had used the compartment above his seat','The aircraft was diverted','He missed a meal','His ticket was cancelled'],['What happened before the disagreement was settled?','The crew listened to both passengers','The flight landed','The bags were unloaded','The captain changed the route']],
[['What should happen to irregularities?','They must be reported appropriately','Passengers should repair them','They should always be ignored','They should be hidden'],['Which sentence matches the text?','Special meals are distributed using crew information','Passengers check equipment','Only ground staff make announcements','Seat belts are never required']],
[['What did the first passenger report?','She felt unwell','She had lost her passport','She wanted a refund','She had missed boarding'],['When would an update be given?','When information became available','Only after landing','Before the flight was scheduled','Never']],

let emResponses={};
function emCheck(id,correct,explanation){let el=document.getElementById('em-'+id),selected=el?.querySelector('input:checked');let fb=document.getElementById('emfb-'+id);if(!selected){fb.textContent='Choose an answer first.';return}let ok=selected.value===correct;emResponses[id]=ok;fb.innerHTML=(ok?'✓ Correct. ':'✕ Review: ')+explanation;fb.style.background=ok?'#e8f6ed':'#fff0ed'}

function emSupplement(i){let x=emLessons[i];return `<section class="panel em-module"><div class="em-kicker">Exam-focused practice · Lesson ${i+1}</div><h2>${x.heading}</h2><p><b>Learning focus:</b> ${x.focus}. This section adds original practice inspired by independent preparation resources, not official Emirates exam items.</p><h3>Reading passage · Workplace scenario</h3><div class="em-reading">${x.passage}</div><p><b>Tasks:</b> Identify the sequence of events, the passenger’s concern and the crew member’s professional response. Summarise in 45 seconds.</p><h3>Grammar and vocabulary · Choose the best answer</h3>${x.qs.map((q,j)=>emQuestion(`${i}-g${j}`,q,`Correct answer: <b>${q[1]}</b>. Check tense, form and meaning in context.`)).join('')}<h3>Reading comprehension · Meaning and detail</h3>${emReadings[i].map((q,j)=>emQuestion(`${i}-r${j}`,q,`Correct answer: <b>${q[1]}</b>. Find the supporting sentence in the passage.`)).join('')}<details><summary>Interview practice · Model response and STAR technique</summary><p><b>Question:</b> Tell me about a time you helped someone in a difficult situation.</p><p><b>Sample answer:</b> “In my previous customer-facing role, a customer was worried about an unexpected change. My responsibility was to understand the concern and provide accurate information. I listened carefully, checked the available options and explained the next steps in a calm and respectful way. As a result, the customer understood what would happen next. I learned that empathy and clear communication are essential under pressure.”</p><p><b>Personalise:</b> Replace this fictional example with a truthful experience of your own.</p></details></section>`}
function emExamLink(){return `<section class="panel em-module"><div class="em-kicker">Extra exam practice · Optional resources</div><h2>Exam A and Exam B — where to find them</h2><p>The video’s creators sell two practice exams: 31 questions each (20 grammar and 11 reading), 62 questions total. These optional practice materials are provided by an independent publisher.</p><p><a href="https://wishcasting.net/emirates-english-test" target="_blank" rel="noopener">Open WishCasting — Exam A + Exam B purchase page ↗</a></p><p><a href="https://payhip.com/b/ngUtD" target="_blank" rel="noopener">Alternative Payhip product page ↗</a></p><p>Our lessons and the original exercises above are free to use locally. The paid exam questions are not copied or unlocked here.</p><h3>How to study with the video</h3><div class="em-steps"><span>Grammar & Vocabulary</span><span>Reading</span><span>Timed practice</span><span>Review mistakes</span></div><p>Video claim: 20 grammar/vocabulary questions and 11 reading questions. Another independent website describes 30 fill-in-the-blank questions. The official test specification is not publicly verified.</p></section>`}
</script><script>const DATA={"units": [["Present Perfect", "Experience & passenger care", "Describe experience and handle requests"], ["Past Perfect", "Passenger incidents & storytelling", "Tell a clear STAR story"], ["Passive Voice", "Safety & service procedures", "Explain what is done and why"], ["Reported Speech", "Complaints & handovers", "Relay information accurately"], ["Conditionals", "Decisions & difficult situations", "Offer safe, empathetic solutions"], ["Final Assessment", "Interview & cabin scenarios", "Perform under realistic time pressure"]], "quiz": [{"unit": 0, "q": "I ___ with customers for three years.", "opts": ["had worked", "have worked", "worked", "am working"], "a": 1, "ex": "Correct answer: have worked. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "She ___ an upset passenger yesterday.", "opts": ["helps", "helped", "had helped", "has helped"], "a": 1, "ex": "Correct answer: helped. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "We ___ already ___ the request.", "opts": ["did|receive", "had|receiving", "are|received", "have|received"], "a": 3, "ex": "Correct answer: have / received. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "Have you ever ___ a complaint?", "opts": ["handles", "handled", "handling", "handle"], "a": 1, "ex": "Correct answer: handled. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "I ___ in hospitality since 2022.", "opts": ["work", "have worked", "had work", "worked"], "a": 1, "ex": "Correct answer: have worked. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "Last week I ___ a training session.", "opts": ["attended", "have attended", "attend", "had attend"], "a": 0, "ex": "Correct answer: attended. Check the tense, meaning and sentence structure."}, {"unit": 0, "q": "I ___ never ___ an international flight.", "opts": ["am|take", "did|taken", "had|take", "have|taken"], "a": 3, "ex": "Correct answer: have / taken. pts": ["are", "be", "been", "being"], "a": 1, "ex": "Correct answer: be. Check the tense, meaning and sentence structure."}, {"unit": 2, "q": "Passengers are ___ to remain seated.", "opts": ["asks", "asked", "asking", "ask"], "a": 1, "ex": "Correct answer: asked. Check the tense, meaning and sentence structure."}, {"unit": 2, "q": "The report has ___ completed.", "opts": ["being", "been", "was", "be"], "a": 1, "ex": "Correct answer: been. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“I need assistance.” → The passenger said she ___ assistance.", "opts": ["needs", "needing", "had need", "needed"], "a": 3, "ex": "Correct answer: needed. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“We are delayed.” → The captain said they ___ delayed.", "opts": ["were", "had been being", "was", "are"], "a": 0, "ex": "Correct answer: were. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“Please remain seated.” → The crew asked passengers ___ seated.", "opts": ["remained", "remain", "remaining", "to remain"], "a": 3, "ex": "Correct answer: to remain. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“I lost my bag.” → He said he ___ his bag.", "opts": ["is losing", "had lost", "loses", "has lost"], "a": 1, "ex": "Correct answer: had lost. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "She asked ___ the meal contained nuts.", "opts": ["that", "whether", "what", "which"], "a": 1, "ex": "Correct answer: whether. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "The passenger told me ___ the issue.", "opts": ["for", "about", "to", "at"], "a": 1, "ex": "Correct answer: about. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“I am cold.” → She said she ___ cold.", "opts": ["is being", "had cold", "be", "was"], "a": 3, "ex": "Correct answer: was. Check the tense, meaning and sentence structure."}, {"unit": 3, "q": "“We have finished.” → The eeds", "had needed", "needed", "will need"], "a": 0, "ex": "Correct answer: needs. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If I had known, I ___ sooner.", "opts": ["would have acted", "would act", "act", "will act"], "a": 0, "ex": "Correct answer: would have acted. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If the cabin is noisy, I ___ clearly and calmly.", "opts": ["will speak", "would spoke", "speaking", "had spoken"], "a": 0, "ex": "Correct answer: will speak. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If I were the team leader, I ___ tasks fairly.", "opts": ["had delegated", "delegate yesterday", "will delegated", "would delegate"], "a": 3, "ex": "Correct answer: would delegate. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If the passenger had asked, we ___ an alternative.", "opts": ["could have offered", "could offer yesterday", "can offer", "offered"], "a": 0, "ex": "Correct answer: could have offered. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If you ___ help, please let me know.", "opts": ["need", "needed", "had needed", "will need"], "a": 0, "ex": "Correct answer: need. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "Unless the situation improves, we ___ the supervisor.", "opts": ["contacted yesterday", "would contacted", "had contacted", "will contact"], "a": 3, "ex": "Correct answer: will contact. Check the tense, meaning and sentence structure."}, {"unit": 4, "q": "If I had been there, I ___ the concern.", "opts": ["would escalate", "would have escalated", "escalate", "will escalate"], "a": 1, "ex": "Correct answer: would have escalated. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "Please ___ your seat belt before take-off.", "opts": ["hold up", "close in", "attach on", "fasten"], "a": 3, "ex": "Correct answer: fasten. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "The passenger complained ___ the delay.", "opts": ["on", "with", "about", "for"], "a": 2, "ex": "Correct answer: about. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "Crew members must comply ___ safety procedures.", "opts": ["to", "with", "by", "at"], "a": 1, "ex": "Correct answer: with. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "We will keep you ___ about the situation.", "opts": ["inform", "informed", "information", "informing"], "a": 1, "ex": "Correct answer: informed. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "The bag should be placed in the ___.", "opts": ["boarding gate", "runway", "overhead bin", "flight deck"], "a": 2, "ex": "Correct answer: overhead bin. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "If I had noticed the problem, I ___ it immediately.", "opts": ["would have reported", "would report", "will report", "had report"], "a": 0, "ex": "Correct answer: would have reported. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "The passenger requested assistance ___ their luggage.", "opts": ["with", "at", "on", "by"], "a": 0, "ex": "Correct answer: with. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "Please remain seated ___ the seat belt sign is on.", "opts": ["while", "unless", "although of", "despite"], "a": 0, "ex": "Correct answer: while. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "We apologised ___ the inconvenience.", "opts": ["to", "with", "by", "for"], "a": 3, "ex": "Correct answer: for. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "The crew handled the complaint ___.", "opts": ["profession", "professing", "professional", "professionally"], "a": 3, "ex": "Correct answer: professionally. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "The customer was ___ about the delay.", "opts": ["concerning", "concern", "concerns", "concerned"], "a": 3, "ex": "Correct answer: concerned. Check the tense, meaning and sentence structure."}, {"unit": 5, "q": "Please ___ the crew instructions.", "opts": ["do", "follow", "bring", "make"], "a": 1, "ex": "Correct answer: follow. Check the tense, meaning and sentence structure."}], "scenarios": [["A passenger has lost their boarding pass", "I understand how stressful that must feel. Let me check what assistance is available and direct you to the appropriate ground staff."], ["A passenger asks to move to Business Class", "I understand you would prefer another seat. I can check the available options, but I cannot promise an upgrade."], ["A passenger is anxious during turbulence", "I understand this feels uncomfortable. Please keep your seat belt fastened. I will update you as soon as I have information."], ["A passenger reports a nut allergy", "Thank you for telling me. I will check the available allergen information and follow our crew procedures. I cannot guarantee an allergen-free environment."], ["A passenger becomes verbally aggressive", "I want to help resolve this. Please speak calmly so I can understand the issue. I will involve the senior crew member if needed."], ["A passenger feels dizzy", "Please remain seated. I will alert the senior crew member and follow the appropriate medical assistance procedures."], ["Two passengers argue about overhead baggage", "I can see this is frustrating. Let me check what space is available and help you find a safe solution."], ["A passenger misses a special meal", "I am sorry your requested meal is not available. Let me check the alternatives and see what we can offer."], ["A parent asks for help with a crying baby", "I can see this is a challenging moment. Is there anything within our service options that would help you feel more comfortable?"], ["A passenger refuses to fasten their seat belt", "For everyone’s safety, your seat belt must be fastened when instructed. If you need assistance, I am here to help."], ["A flight is delayed and passengers are upset", "I understand the delay is disappointing. I will share confirmed updates as soon as they become available."], ["A passenger reports an unattended bag", "Thank you for letting us know. Please leave the item where it is while I notify the appropriate crew member."]], "interviews": [["Tell me about yourself.", "I have experience working with people in fast-paced environments, where I learned to listen carefully, stay organised and remain calm under pressure. I enjoy helping customers feel welcome and supported. I would now like to apply these skills in an international cabin crew role."], ["Why do you want to work for Emirates?", "I am attracted to Emirates because of its international environment and its strong focus on service and safety. I would value the opportunity to learn from a multicultural team and contribute to a positive passenger experience."], ["Tell me about a difficult customer.", "In my previous role, a customer was upset about a delay. My task was to help them feel heard and find a practical solution. I listened without interrupting, explained what I could do and offered a realistic alternative. The customer calmed down and thanked me for my support."], ["Describe a time you worked in a team.", "During a particularly busy shift, our team faced several requests at once. We divided responsibilities, checked in regularly and helped one another. We managed the workload while maintaining a friendly service."], ["What would you do if a passenger became aggressive?", "I would stay calm, use respectful language, keep an appropriate distance and listen without escalating the situation. I would follow company procedures and involve the senior crew member promptly if safety was at risk."], ["What is your greatest strength?", "One of my strengths is remaining calm and attentive under pressure. I try to understand what a person needs before deciding how to help, while respecting procedures and team responsibilities."], ["How do you handle cultural differences?", "I avoid assumptions, listen carefully and adapt my communication style. If I am unsure, I ask respectful questions and focus on making each passenger feel understood."], ["Describe a mistake and what you learned.", "I once misunderstood a customer’s request because I did not confirm a detail. I apologised, corrected the issue and learned to summarise requests before taking action."]], "terms": [["aisle", "/aɪl/", "passage between seats"], ["galley", "/ˈɡæli/", "onboard preparation area"], ["overhead bin", "/ˌəʊvəhed ˈbɪn/", "storage above seats"], ["bulkhead", "/ˈbʌlkhed/", "cabin partition"], ["jumpseat", "/ˈdʒʌmpsiːt/", "crew seat"], ["flight deck", "/ˈflaɪt dek/", "pilot operating area"], ["purser", "/ˈpɜːsə/", "senior cabin crew role"], ["cabin crew", "/ˈkæbɪn kruː/", "flight attendants"], ["economy class", "/ɪˈkɒnəmi klɑːs/", "economy cabin"], ["business class", "/ˈbɪznəs klɑːs/", "premium cabin"], ["first class", "/ˌfɜːst ˈklɑːs/", "first-class cabin"], ["upper deck", "/ˌʌpə ˈdek/", "upper level on A380"], ["lower deck", "/ˌləʊə ˈdek/", "main level on A380"], ["evacuate", "/ɪˈvækjueɪt/", "leave in an emergency"], ["turbulence", "/ˈtɜːbjələns/", "irregular air movement"]]};const units=DATA.units,quiz=DATA.quiz,scenarios=DATA.scenarios,interviews=DATA.interviews,terms=DATA.terms;let current=0;let answers={};function speak(s){if(!('speechSynthesis'in window)){alert('Speech is not available in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}function nav(i){current=i;document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));render();scrollTo({top:0,behavior:'smooth'})}function makeQuiz(i){return quiz.filter(x=>x.unit===i).map((x,k)=>{let key=i+'-'+k;return `<div class="question"><b>${k+1}. ${x.q}</b>${x.opts.map((o,j)=>`<button class="choice ${answers[key]===j?(j===x.a?'correct':'wrong'):''}" onclick="pick('${key}',${j},${x.a})">${String.fromCharCode(65+j)}. ${o.replace('|',' … ')}</button>`).join('')}<div class="feedback" id="fb-${key}">${answers[key]===undefined?'Choose the best answer.':(answers[key]===x.a?'✓ Correct. ':'Not quite. ')+x.ex}</div></div>`}).join('')}function pick(key,j,a){answers[key]=j;render()}function model(q,a){return `<div class="card"><b>${q}</b><details><summary>Show model answer</summary><p>${a}</p><button class="btn alt" onclick="speak(${JSON.stringify(a).replaceAll('"','&quot;')})">▶ Listen to model</button></details><p class="muted">Your own STAR answer:</p><textarea placeholder="Write your own genuine experience; do not memorise an invented story."></textarea></div>`}function render(){let i=current,u=units[i];document.getElementById('content').innerHTML=`<section class="panel"><span class="pill">LESSON ${i+1} / 6</span><h2>${u[0]}</h2><p>${u[1]} · ${u[2]}</p><p class="muted">Suggested sequence: warm-up → notice grammar → practice → passenger scenario → interview response.</p></section>${i===0?`<section class="panel"><h2>Cabin orientation · Visual guide</h2><p>Illustrative A380 layout, not an operational aircraft map. Actual cabin configurations vary.</p><div class="diagram"><div class="deck"><b>Upper deck</b>First Class / Business Class (typical A380 configuration)</div><div class="deck"><b>Main deck</b>Economy Class / selected Premium Economy layouts</div></div><p class="muted">Cabin terms: aisle, galley, bulkhead, jumpseat, overhead bin, flight deck.</p><a target="_blank" rel="noopener" href="https://www.emirates.com/english/experience/our-fleet/a380/">Explore official Emirates A380 photos and cabins ↗</a><div class="cards">${terms.map(t=>`<div class="card"><b>${t[0]}</b><div class="muted">${t[1]}</div><p>${t[2]}</p><button class="btn alt" onclick="speak('${t[0]}')">▶ Hear pronunciation</button></div>`).join('')}</div></section>`:''}<section class="panel"><h2>Grammar Lab · 12 questions</h2><p>Choose the correct answer. Immediate feedback explains the correct form. Answers can be changed.</p>${makeQuiz(i)}</section><section class="panel"><h2>Passenger Experience Lab</h2><p>Role-play: listen → acknowledge → act within procedures → communicate clearly → escalate when necessary.</p><div class="cards">${scenarios.slice(i*2,i*2+2).map(s=>`<div class="card"><span class="pill">Cabin simulation</span><h3>${s[0]}</h3><p><b>Task:</b> Respond in 30–45 seconds, then suggest the next safe action.</p><details><summary>Model response</summary><p>${s[1]}</p><button class="btn alt" onclick="speak(this.parentElement.querySelector('p').textContent)">▶ Listen</button></details><textarea placeholder="Write your response in English..."></textarea></div>`).join('')}</div></section><section class="panel"><h2>Interview Practice</h2><div class="cards">${[interviews[i%interviews.length],interviews[(i+2)%interviews.length]].map(x=>model(x[0],x[1])).join('')}</div></section>${i===0||i===5?`<section class="panel"><h2>Video Listening & Critical Viewing</h2><p><b>Video A — English assessment overview</b></p><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/frINY2ntb4s" allowfullscreen title="Emirates English test preparation"></iframe><p><b>Video B — video provided for class</b></p><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/kH7NFxcf0ms" allowfullscreen title="Cabin crew video"></iframe><p class="muted">If playback is blocked, open on <a target="_blank" href="https://www.youtube.com/watch?v=frINY2ntb4s">YouTube A</a> or <a target="_blank" href="https://www.youtube.com/watch?v=kH7NFxcf0ms">YouTube B</a>. Watch both videos and compare the main ideas.</p><div class="cards">${['What is the main purpose of each video? Give two pieces of evidence.','Which three English expressions are useful for cabin crew? Explain them.','What is presented as fact, and what is the speaker’s opinion?','Summarise one useful recommendation in 45 seconds.','What question would you ask the speaker? Why?','Which advice can you apply to your interview preparation?'].map(q=>`<div class="card"><b>${q}</b><textarea placeholder="Answer after watching..."></textarea></div>`).join('')}</div></section>`:''}${emSupplement(i)}${i===5?emExamLink():""}${i===5?`<section class="panel"><h2>Additional resources</h2><p><a href="https://wishcasting.net/emirates-english-test" target="_blank">Exam A + Exam B — purchase page (third-party)</a></p><p><a href="https://wordwall.net/es/resource/3123685/flight-attendant-interview-questions-3dt" target="_blank">Interview questions · Wordwall</a></p><p><a href="https://heraviationera.com/english-test" target="_blank">Independent English diagnostic</a></p><p><a href="https://aptitude-test-prep.com/employers/aviation-assessments/emirates-english-test/" target="_blank">Independent exam format overview</a></p><p><a href="https://www.emiratesgroupcareers.com/cabin-crew/" target="_blank">Official recruitment and training information</a></p><p class="source">Training examples are fictional. Follow official company procedures and qualified crew guidance for actual safety, security and medical events. This is not an Emirates-endorsed course.</p></section>`:''}<section class="panel"><button class="btn" onclick="nav(${(i+1)%6})">${i===5?'Return to lesson 1':'Next lesson →'}</button><span class="stat">${Object.keys(answers).filter(k=>Number(k.split('-')[0])===i).length}/12 answered</span></section>`}document.addEventListener('DOMContentLoaded',()=>{document.querySelector('nav').innerHTML=units.map((u,i)=>`<button onclick="nav(${i})">${i+1}. ${u[0]}</button>`).join('');nav(0)})</script><style>
.roleplay-panel{border-top:5px solid #c8102e}.roleplay-card{background:#fff;border:1px solid #e7dce0;border-radius:14px;padding:18px;margin:14px 0}.roleplay-card h3{color:#9e1029}.roleplay-card textarea{width:100%;min-height:95px;margin:12px 0}.roleplay-card details{margin-top:12px;background:#fff5f6;padding:12px;border-radius:9px}.roleplay-card summary{cursor:pointer;color:#a10d29;font-weight:700}.roleplay-step{font-weight:700;color:#a10d29;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}.roleplay-hint{font-size:.9rem;color:#555}

const INTERVIEW_ROLEPLAYS=[{"topic": "Angry passenger / broken seat", "question": "How would you handle an angry passenger whose seat does not recline?", "answer": "I would listen without interrupting, acknowledge the inconvenience and apologise. I would check available options with the crew, explain what I can offer and follow up to make sure the passenger feels supported."}, {"topic": "Nervous passenger during turbulence", "question": "How would you reassure a nervous flyer during turbulence?", "answer": "I would speak calmly and acknowledge their anxiety. I would remind them to follow seat-belt instructions, offer reassurance without making guarantees, and check on them when it is safe to do so."}, {"topic": "Medical emergency on board", "question": "What would you do if a passenger suddenly became unwell?", "answer": "I would alert the senior crew immediately, follow my training and the airline’s emergency procedures, and help keep the surrounding area clear. I would communicate accurately and avoid acting beyond my training."}, {"topic": "Rude or demanding passenger", "question": "How would you respond to a rude or demanding passenger?", "answer": "I would remain courteous, listen to the request and explain when I can assist. I would set respectful boundaries if necessary and keep the passenger updated."}, {"topic": "Cultural misunderstanding", "question": "How would you manage a cultural misunderstanding between passengers?", "answer": "I would listen to both passengers without making assumptions, clarify the misunderstanding in neutral language and encourage respectful communication. I would involve a senior colleague if the conflict continued."}, {"topic": "Seat change request", "question": "How would you handle a request to change seats?", "answer": "I would ask why the passenger wishes to move, check availability and any seating restrictions, and explain the options honestly. If a move is not possible, I would explore appropriate alternatives."}, {"topic": "Crying child on board", "question": "What would you do if a child was crying during the flight?", "answer": "I would approach the parent or caregiver with empathy and ask whether they would like assistance. Where available and appropriate, I could offer a child-friendly distraction while respecting the family’s preferences."}, {"topic": "Complaint about a meal", "question": "How would you respond to a complaint about a meal?", "answer": "I would apologise for the disappointing experience, check the available meal options and any dietary requirements, and offer a suitable alternative if one is available."}, {"topic": "Passenger refuses a seat belt", "question": "What would you do if a passenger refused to fasten their seat belt?", "answer": "I would politely explain that following crew safety instructions is essential. If the passenger continued to refuse, I would inform the senior crew and follow the applicable procedure."}, {"topic": "Spilled drink", "question": "How would you respond if a passenger spilled a drink?", "answer": "I would check whether anyone was hurt, offer napkins and assistance, and arrange cleaning or a replacement drink where possible. I would ensure the area was safe before continuing service."}, {"topic": "Passenger ignores device instructions", "question": "What would you do if a passenger ignored electronic-device instructions?", "answer": "I would restate the current crew instruction politely and explain that it applies to everyone. If the passenger refused to comply, I would refer the matter to the senior crew."}, {"topic": "Overhead bin disagreement", "question": "How would you resolve an argument over overhead-bin space?", "answer": "I would de-escalate the conversation, check for safe storage alternatives and explain the available options fairly. I would never promise space that had not been confirmed."}, {"topic": "Passenger with reduced mobility", "question": "How would you assist a passenger with reduced mobility?", "answer": "I would ask how the passenger prefers to be assisted, respect their independence and dignity, and coordinate any required support with trained colleagues."}, {"topic": "Discomfort due to cabin pressure", "question": "How would you respond to discomfort caused by cabin-pressure changes?", "answer": "I would listen to the passenger, offer calm reassurance and follow the airline’s guidance. If symptoms were severe or persistent, I would alert the appropriate crew member."}, {"topic": "Passenger missed meal service", "question": "What would you do if a passenger missed the meal service?", "answer": "I would check whether a meal is still available and offer an appropriate alternative if not. I would explain the options clearly without making promises I could not keep."}, {"topic": "Passenger loses an item", "question": "How would you help a passenger who had lost an item?", "answer": "I would ask for a description, check appropriate nearby areas and notify colleagues in accordance with the lost-property procedure. I would keep the passenger informed."}, {"topic": "Emotionally distressed passenger", "question": "How would you support a passenger who appeared emotionally distressed?", "answer": "I would approach discreetly, ask whether they need support and listen without judgement. I would respect their privacy and seek senior-crew assistance when necessary."}, {"topic": "Delayed departure complaint", "question": "How would you respond to a complaint about a delayed departure?", "answer": "I would acknowledge the frustration, provide only confirmed updates and explain what passengers can expect next. I would avoid speculating about departure times."}, {"topic": "Two passengers assigned one seat", "question": "What would you do if two passengers had been assigned the same seat?", "answer": "I would check both boarding passes, apologise for the confusion and coordinate with the responsible crew or ground team to resolve the allocation before departure."}, {"topic": "Special celebration request", "question": "How would you handle a special celebration request?", "answer": "I would thank the passenger for sharing the occasion, check what is possible under service guidelines and coordinate with the team before promising anything."}, {"topic": "Passenger refuses crew instructions", "question": "What would you do if a passenger refused to follow crew instructions?", "answer": "I would remain calm but firm, explain the safety requirement clearly and involve the senior crew if the passenger did not comply. Safety would take priority."}, {"topic": "Food spilled on another passenger", "question": "How would you respond if food was spilled on another passenger?", "answer": "I would check both passengers are okay, help with the clean-up and offer appropriate assistance. I would address the inconvenience without assigning blame."}, {"topic": "Language barrier", "question": "How would you communicate with a passenger who did not speak English?", "answer": "I would use short, clear sentences, visual cues when appropriate and a bilingual colleague if available. I would confirm understanding, especially for safety instructions."}, {"topic": "Unattended bag", "question": "What would you do if you noticed an unattended bag?", "answer": "I would not touch or move the item. I would notify the senior crew promptly and follow the airline’s security procedures while keeping communication calm."}, {"topic": "Passenger praises the crew", "question": "How would you respond to a passenger who praised the crew?", "answer": "I would thank the passenger sincerely, share the compliment with the team and, where appropriate, pass the feedback through the usual channel."}];
const originalRender=render;
render=function(){originalRender();const i=current;const start=i===5?20:i*4;const end=i===5?25:start+4;const subset=INTERVIEW_ROLEPLAYS.slice(start,end);const panel=document.createElement('section');panel.className='panel roleplay-panel';panel.innerHTML='<span class="pill">INTERVIEW ROLE-PLAY LAB</span><h2>First, what would YOU say?</h2><p>Read the interviewer’s question. Speak for 45–60 seconds, then write your answer. <b>Only after that</b>, open the B2 model answer. The models are original teaching examples, not official Emirates scripts.</p>'+subset.map((r,k)=>`<article class="roleplay-card"><div class="roleplay-step">Situation ${start+k+1} / 25 · ${r.topic}</div><h3>${r.question}</h3><p class="roleplay-hint">1 · Think: acknowledge → act → safety/teamwork → follow-up. 2 · Say your answer aloud. 3 · Write it below.</p><textarea aria-label="Your answer to situation ${start+k+1}" placeholder="I would start by... Then I would..." ></textarea><details><summary>4 · Reveal B2 model answer + listen</summary><p>${r.answer}</p><button class="btn alt" type="button" onclick="speak(INTERVIEW_ROLEPLAYS[${start+k}].answer)">▶ Listen to the model</button><p class="roleplay-hint">5 · Compare with your own answer. Say it again using your own words.</p></details></article>`).join('');const target=document.querySelector('#content .em-module');if(target)target.before(panel);else document.querySelector('#content').append(panel)};
</script><style>
:root{--fly-red:#c8102e;--fly-gold:#bd9151}header{background:linear-gradient(115deg,#a40e2a,#c8102e 65%,#7f1025)}nav button.active,.btn{background:var(--fly-red);color:white}.fly-image{width:100%;height:auto;border-radius:12px;border:1px solid #eee}.fly-arrow{display:inline-flex;align-items:center;justify-content:center;background:#c8102e;color:#fff;border:2px solid #bd9151;border-radius:50%;width:30px;height:30px}.fly-reading{background:#fff9f4;border:1px solid #f1dfcf;border-radius:12px;padding:16px;margin:14px 0}.fly-reading select{max-width:190px;border:1px solid #d8b7b8;border-radius:7px;padding:5px;background:white;font:inherit}.fly-good{color:#17683b}.fly-bad{color:#a0192d}.fly-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.fly-roles .card{border-left:4px solid #c8102e}.fly-video{max-width:780px}.fly-step{display:inline-block;background:#f9e9ed;color:#92132b;border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px}

const FLY_NAMES=['Who’s Who & Where?','Present Perfect · Experience','Past Perfect · Stories','Passive Voice · Safety','Reported Speech · Handover','Conditionals · Decisions','Mock Assessment · Interview'];
const FLY_ROLES=[['Pilot','Operates the aircraft'],['First officer / Co-pilot','Assists the captain'],['Purser','Leads and coordinates cabin crew'],['Cabin crew member','Supports passenger safety and service'],['Ground handling agent','Coordinates turnaround tasks'],['Baggage handler','Loads and unloads baggage'],['Aircraft maintenance engineer','Inspects and maintains aircraft'],['Ramp agent','Coordinates aircraft-side operations'],['Air traffic controller','Manages aircraft traffic'],['Cabin cleaner','Prepares and cleans the cabin'],['Load controller','Plans aircraft load and balance'],['Pushback tug operator','Helps move the aircraft away from the stand'],['Galley','Onboard food and beverage preparation area'],['Hangar','Building used for aircraft maintenance'],['Upper deck','Upper passenger level on some aircraft'],['Main deck','Main passenger level']];
const FLY_READINGS=[
{title:'Reading 1 · Ground operations',words:['aircraft maintenance engineer','baggage handlers','load controller','ramp agent','pushback tug operator'],text:'Before departure, the {0} checks the aircraft’s technical condition. The {1} move luggage to the aircraft. The {2} prepares load and balance information. The {3} coordinates activities on the ramp. Finally, the {4} helps move the aircraft away from the stand.'},
{title:'Reading 2 · Inside the cabin',words:['purser','galley','first class','cabin crew','economy class'],text:'The {0} coordinates the cabin team. The {1} assist passengers during boarding and service. Food and drinks are prepared in the {2}. Depending on the aircraft configuration, passengers may travel in {3} or {4}.'},
{title:'Reading 3 · A day in cabin crew life',words:['safety','passengers','serving','teamwork','professional'],text:'Cabin crew are responsible for the {0} and comfort of {1}. Their duties may include {2} meals, responding to requests and communicating important information. Strong {3} helps colleagues work together. A calm and {4} attitude makes a difference during challenging situations.'}

function flyReading(r,i){let html=r.text.replace(/\{(\d+)\}/g,(_,j)=>`<select aria-label="Blank ${Number(j)+1}" data-answer="${r.words[Number(j)]}" id="fly-${i}-${j}"><option value="">Choose...</option>${[...r.words].sort((a,b)=>a.localeCompare(b)).map(w=>`<option>${w}</option>`).join('')}</select>`);return `<div class="fly-reading"><h3>${r.title}</h3><p>${html}</p><button class="btn" onclick="flyCheck(${i})">Check answers <span class="fly-pretty-arrow" aria-hidden="true"></span></button><span id="fly-feedback-${i}" aria-live="polite"></span></div>`}
function flyCheck(i){let ss=[...document.querySelectorAll(`[id^="fly-${i}-"]`)];let ok=ss.filter(x=>x.value===x.dataset.answer).length;ss.forEach(x=>x.style.borderColor=x.value===x.dataset.answer?'#24884c':'#c8102e');document.getElementById('fly-feedback-'+i).innerHTML=` <b class="${ok===ss.length?'fly-good':'fly-bad'}">${ok}/${ss.length} correct</b>`}
function flyHome(){document.getElementById('content').innerHTML=`<section class="panel"><span class="pill">UNIT 1 / 7 · START HERE</span><h2>Who’s Who & Where?</h2><p>Meet the people who make a flight possible, from the hangar and ramp to the flight deck and passenger cabin.</p><span class="fly-step">1 · Look and identify</span><img class="fly-image" src="data:image/webp;base64,${FLY_IMAGE}" alt="Flying Together: illustrated aircraft and airport operations, with labeled ground crew, aircraft interior, maintenance and security" loading="eager" decoding="async" /><p class="fly-image-note">Explore the aircraft, the crew and the ground operations. This is an educational illustration; layouts and duties may vary.</p></section><section class="panel"><span class="fly-step">2 · Vocabulary & pronunciation</span><h2>Who does what?</h2><p>Read each job title, predict the responsibility, then select Listen. The pronunciation uses your browser’s English voice.</p><div class="fly-roles">${FLY_ROLES.map(([w,d])=>`<div class="card"><b>${w}</b><p class="muted">${d}</p><button class="btn alt" onclick="speak('${w.replaceAll("'","\\'")}')">▶ Listen</button></div>`).join('')}</div></section><section class="panel"><span class="fly-step">3 · Read and complete</span><h2>Three vocabulary texts</h2><p>Complete each text using the words in the dropdown menus. Then check your answers.</p>${FLY_READINGS.map(flyReading).join('')}</section><section class="panel fly-video"><span class="fly-step">4 · Watch, understand & speak</span><h2>Flying Together · Video comprehension</h2><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/6I74H1vJ99k" title="Flying Together — class video" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=6I74H1vJ99k" target="_blank" rel="noopener">Open video on YouTube ↗</a></p><p class="muted">Watch carefully, take notes and discuss your ideas with your teacher.</p>${['What is the main message of the video? Support your answer with two details.','Which aviation jobs or teamwork skills can you connect to the video?','What new words or expressions did you notice? Explain three.','In 45 seconds, explain why teamwork matters in aviation.'].map(q=>`<div class="question"><b>${q}</b><textarea placeholder="Your answer in English..."></textarea></div>`).join('')}</section><section class="panel"><span class="fly-step">5 · Speak first, then compare</span><h2>Mini interview</h2><b>What attracts you to working as part of a cabin crew team?</b><textarea placeholder="First, say your answer aloud. Then write it here..."></textarea><details><summary>Reveal a B2 model answer</summary><p>What attracts me most is the opportunity to combine customer service, teamwork and responsibility. I enjoy meeting people from different backgrounds, and I believe that staying calm, communicating clearly and supporting colleagues are essential for a positive passenger experience. I would like to develop these skills further in a professional aviation environment.</p><button class="btn alt" onclick="speak(this.parentElement.querySelector('p').textContent)">▶ Listen</button></details></section><section class="panel"><button class="btn" onclick="flyNav(1)">Continue to Unit 2 <span class="fly-pretty-arrow" aria-hidden="true"></span></button></section>`}

igh visibility vest so that motorists can see them at night.", "options": ["Relevant", "Designed", "Necessary", "Available"], "answer": 2, "note": ""}, {"n": 21, "q": "The firefighters wore protective hood to minimize the ________ of exposure to fire.", "options": ["Risk", "Safety", "Condition", "Incident"], "answer": 0, "note": ""}, {"n": 22, "q": "The customer was shouting and swearing at the bartender. His behavior was hardly _____________.", "options": ["Appropriate", "Applicable", "Descent", "Inappropriate"], "answer": 0, "note": "The original sentence says “hardly appropriate”, so appropriate is the answer. “Descent” appears to be a typo for “decent”."}, {"n": 23, "q": "Always familiarize yourself with the location of the emergency__________ in a building in case of a sudden evacuation.", "options": ["Access", "Exits", "Effects", "Environment"], "answer": 1, "note": ""}, {"n": 24, "q": "The trainer is sick today. Do you think the training__________?", "options": ["Will be happen", "Will postpone", "Won’t be scheduling", "Will be cancelled"], "answer": 3, "note": ""}, {"n": 25, "q": "The elevator is __________ maintenance today. Go to the classroom via the stairs.", "options": ["In", "Over", "Under", "Between"], "answer": 2, "note": ""}, {"n": 26, "q": "This course has both _______ and the theoretical components. In other words, you will need to show your learning through actions and also explain it through writing.", "options": ["Digital", "Effective", "Standard", "Practical"], "answer": 3, "note": ""}, {"n": 27, "q": "According to the company manual, you shall not accept an item for return_________ the customer is able to produce a receipt.", "options": ["Unless", "Regardless", "Despite", "Except"], "answer": 0, "note": ""}, {"n": 28, "q": "During the descent, several climbers collapsed from ________. It was a long and tiring journey.", "options": ["Awareness", "Aid", "Fatigue", "Fumes"], "answer": 2, "note": ""}, {"n": 29, "q": "The departure of the ferry was delayed by an hour at the crowd refused to _______ with the crew’s instructions to stay seated.", "options": ["Sit", "Listen and comply", "Control", "Understood and follow"], "answer": 1, "note": "The source appears to contain a typo (“at the crowd”); “as the crowd” would be grammatical. Choose the option that best completes “refused to ... with”. The supplied option “Listen and comply” creates a repeated “with”; this question is flawed in the source."}, {"n": 30, "q": "Unfortunately there are many cases of passengers attempting to transport __________ items on the aircraft in their hand luggage, including flammable liquids, toxic substances and lithium batteries. These are hazardous items that are either restricted or not permitted on board at all.", "options": ["Electrical", "Dangerous", "Secure", "harmeless"], "answer": 1, "note": "“Dangerous items” is the intended meaning; specific restrictions depend on the item and airline rules."}];
function flyingEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function flyingRenderTest(){
 const root=document.querySelector('#content');if(!root||document.getElementById('flying-mcq'))return;
 const section=document.createElement('section');section.id='flying-mcq';
 section.innerHTML=`<h2>Final English Test · 30 Multiple-Choice Questions</h2><p class="mcq-intro">Practice test based on the PDF supplied for this course. Choose one answer per question. Each answer is checked immediately when you select it. Select <strong>Check my answers</strong> to see your total score and review all explanations. Use your results to identify what to practise next.</p><div id="flying-mcq-items"></div><div class="mcq-actions"><button type="button" onclick="flyingGradeTest()">Check my answers</button><button type="button" class="secondary" onclick="flyingResetTest()">Try again</button></div><div id="flying-mcq-score" class="mcq-result" aria-live="polite"></div>`;
 root.appendChild(section);
 section.addEventListener('change',event=>{
  const input=event.target;if(!input.matches('input[type="radio"][name^="fly-mcq-"]'))return;
  const number=Number(input.name.replace('fly-mcq-',''));
  const item=FLYING_PDF_TEST.find(q=>q.n===number);if(!item)return;
  const field=document.getElementById(`flyq-${number}`);
  const feedback=document.getElementById(`flyf-${number}`);
  const correct=Number(input.value)===item.answer;
  field.querySelectorAll('.mcq-choice').forEach(label=>label.classList.remove('is-correct','is-incorrect'));
  input.closest('.mcq-choice').classList.add(correct?'is-correct':'is-incorrect');
  feedback.hidden=false;feedback.className='mcq-feedback '+(correct?'correct':'incorrect');
  feedback.innerHTML=`<strong>${correct?'✓ Correct!':'✗ Incorrect.'}</strong> ${correct?'Well done! ':'The correct answer is <strong>'+ 'ABCD'[item.answer]+'. '+flyingEscape(item.options[item.answer])+'</strong>. '}${flyingEscape(item.note||'Check the grammar, meaning and collocation.')}`;
 });
 document.getElementById('flying-mcq-items').innerHTML=FLYING_PDF_TEST.map(item=>`<fieldset class="mcq-question" id="flyq-${item.n}"><legend>${item.n}. ${flyingEscape(item.q)}</legend>${item.options.map((opt,j)=>`<label class="mcq-choice"><input type="radio" name="fly-mcq-${item.n}" value="${j}"><span><strong>${'ABCD'[j]}.</strong> ${flyingEscape(opt)}</span></label>`).join('')}<div class="mcq-feedback" id="flyf-${item.n}" hidden></div></fieldset>`).join('');
}
function flyingGradeTest(){let score=0,answered=0;FLYING_PDF_TEST.forEach(item=>{const sel=document.querySelector(`input[name="fly-mcq-${item.n}"]:checked`);const feedback=document.getElementById(`flyf-${item.n}`);if(sel)answered++;const ok=sel&&Number(sel.value)===item.answer;if(ok)score++;feedback.hidden=false;feedback.className='mcq-feedback '+(ok?'correct':'incorrect');feedback.innerHTML=`<strong>${ok?'✓ Correct':sel?'✗ Review this answer':'Not answered'}.</strong> Correct answer: <strong>${'ABCD'[item.answer]}. ${flyingEscape(item.options[item.answer])}</strong>. ${flyingEscape(item.note||'Read the sentence again and check the grammar, meaning and collocation.')}`;});document.getElementById('flying-mcq-score').textContent=`Your score: ${score}/30 (${Math.round(score/30*100)}%). Answered: ${answered}/30.`;}
function flyingResetTest(){document.querySelectorAll('#flying-mcq input').forEach(i=>i.checked=false);document.querySelectorAll('#flying-mcq .mcq-feedback').forEach(e=>{e.hidden=true;e.className='mcq-feedback'});document.querySelectorAll('#flying-mcq .mcq-choice').forEach(e=>e.classList.remove('is-correct','is-incorrect'));document.getElementById('flying-mcq-score').textContent='';document.getElementById('flying-mcq').scrollIntoView({behavior:'smooth'});}

<script>
(function(){
  const bar=document.createElement('div');bar.className='fly-toolbar';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Navigation and English pronunciation controls');

  const header=document.querySelector('header');header.insertAdjacentElement('afterend',bar);
  const navEl=document.querySelector('.wrap > nav');if(navEl)navEl.id='fly-lesson-nav';
  const toggle=bar.querySelector('#fly-menu-toggle');
  toggle.addEventListener('click',()=>{const closed=document.body.classList.toggle('fly-menu-closed');toggle.textContent=closed?'☰ Show menu':'☰ Hide menu';toggle.setAttribute('aria-expanded',String(!closed));});
  const synth=window.speechSynthesis;const voiceSelect=bar.querySelector('#fly-voice');const status=bar.querySelector('#fly-audio-status');
  let voiceList=[];let currentUtterance=null;let lastText='';
  function populateVoices(){if(!synth)return;const prior=voiceSelect.value;voiceList=synth.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));voiceSelect.innerHTML='<option value="">Best available English voice</option>';
    voiceList.forEach((v,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=v.name+' ('+v.lang+')';voiceSelect.appendChild(option)});
    if(prior && voiceList[Number(prior)])voiceSelect.value=prior;
  }
  if(synth){populateVoices();if(typeof synth.addEventListener==='function')synth.addEventListener('voiceschanged',populateVoices);else synth.onvoiceschanged=populateVoices;}
  function preferredVoice(){if(voiceSelect.value!=='' && voiceList[Number(voiceSelect.value)])return voiceList[Number(voiceSelect.value)];
    const rank=v=>{const n=v.name.toLowerCase();return (/natural|neural|premium|enhanced|google uk english|microsoft (sonia|ryan|aria)|samantha|daniel/i.test(n)?100:0)+(/en-gb/i.test(v.lang)?30:0)+(/en-us/i.test(v.lang)?10:0)+(v.localService?2:0)};
    return voiceList.slice().sort((a,b)=>rank(b)-rank(a))[0]||null;
  }
  window.speak=function(input){const text=String(input||'').trim();if(!text)return;
    if(!synth){status.textContent='Audio unavailable in this browser';return;}
    synth.cancel();const u=new SpeechSynthesisUtterance(text);const v=preferredVoice();if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=0.94;u.pitch=1.04;u.volume=1;
    currentUtterance=u;lastText=text;u.onstart=()=>status.textContent='Playing';u.onpause=()=>status.textContent='Paused';u.onresume=()=>status.textContent='Playing';u.onend=()=>{if(currentUtterance===u)status.textContent='Finished'};u.onerror=(event)=>{if(event.error!=='canceled'&&event.error!=='interrupted')status.textContent='Audio error: '+event.error};
    synth.speak(u);
  };
  bar.querySelector('#fly-pause').addEventListener('click',()=>{if(synth&&synth.speaking&&!synth.paused){synth.pause();status.textContent='Paused'}});
  bar.querySelector('#fly-resume').addEventListener('click',()=>{if(!synth)return;if(synth.paused){synth.resume();status.textContent='Playing'}else if(!synth.speaking&&lastText)window.speak(lastText)});
  bar.querySelector('#fly-stop').addEventListener('click',()=>{if(synth)synth.cancel();currentUtterance=null;status.textContent='Stopped'});
  voiceSelect.addEventListener('change',()=>{if(synth&&synth.speaking){synth.cancel();status.textContent='Voice selected · press Listen again'}});
})();
</script>
